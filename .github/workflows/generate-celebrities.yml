name: Personenliste erzeugen

# Erzeugt die Personenliste aus Wikidata und committet sie in den Branch, auf dem der Workflow läuft.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "feature/**"]
    paths:
      - "tools/generate_celebrities.py"
      - ".github/workflows/generate-celebrities.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Personen aus Wikidata laden
        run: python tools/generate_celebrities.py
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/resources
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Personenliste aus Wikidata aktualisiert"
            git push origin HEAD:${{ github.ref_name }}
          fi

name: Android CI

on:
  push:
    branches: [main, develop, "feature/**", "claude/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und Debug-APK bauen
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug

      - name: Version bestimmen
        id: version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "who-am-i-v$version.apk"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: who-am-i-debug-apk
          path: who-am-i-v*.apk

      # Jeder Push auf main (also jeder Merge eines Release-PRs) erzeugt ein Release
      # v<versionName> mit der APK. Existiert das Release schon, wird es nicht überschrieben –
      # für ein neues Release muss versionName in app/build.gradle.kts erhöht werden.
      - name: Prüfen, ob das Release schon existiert
        id: existing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${{ steps.version.outputs.tag }} existiert bereits – versionName erhöhen für ein neues Release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release erstellen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Who Am I? ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: "true"
          files: who-am-i-v*.apk

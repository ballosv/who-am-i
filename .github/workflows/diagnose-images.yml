name: Bilder-Diagnose
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/diagnose_images.py"]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/diagnose_images.py
      - run: echo | openssl s_client -connect thumb.wikimedia.org:443 -servername thumb.wikimedia.org -showcerts 2>/dev/null | grep -E "s:|i:"

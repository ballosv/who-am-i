# Xcode-Projekt für die iPhone-App; wird mit XcodeGen erzeugt (`xcodegen generate` in diesem Ordner).
name: WhoAmI
options:
  bundleIdPrefix: de.ballosv
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "8"
targets:
  WhoAmI:
    type: application
    platform: iOS
    sources:
      - WhoAmI
    settings:
      base:
        PRODUCT_NAME: WhoAmI
        PRODUCT_BUNDLE_IDENTIFIER: de.ballosv.whoami
        INFOPLIST_FILE: WhoAmI/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Kotlin-Code bauen
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
